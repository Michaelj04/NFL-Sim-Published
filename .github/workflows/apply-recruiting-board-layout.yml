name: Apply recruiting board layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-recruiting-board-layout.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Simplify Recruiting and add internal scrolling
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path('src/App.tsx')
          css_path = Path('src/styles.css')
          workflow_path = Path('.github/workflows/apply-recruiting-board-layout.yml')

          app = app_path.read_text()
          css = css_path.read_text()

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, found {count}')
              return updated

          app = sub_once(
              app,
              r'const RECRUITING_TAB_ITEMS = \[.*?\] as const;\n\n',
              '',
              'remove recruiting tab definitions',
          )
          app = sub_once(
              app,
              r'const RECRUITING_LANES = \[.*?\] as const;\n',
              '',
              'remove recruiting lane definitions',
          )
          app = replace_once(
              app,
              'import { normalizeAnnualRecruitingState, updateRecruitingPitch, updateRecruitingScoutAssignment } from "./sim/annualRecruiting";',
              'import { normalizeAnnualRecruitingState, updateRecruitingPitch } from "./sim/annualRecruiting";',
              'remove recruiting scout update import',
          )
          app = sub_once(
              app,
              r'\n  function updateCollegeRecruitScout\(assignmentId: string, updates: Parameters<typeof updateRecruitingScoutAssignment>\[2\]\) \{\n    setSave\(\(current\) => current \? updateRecruitingScoutAssignment\(current, assignmentId, updates\) : current\);\n  \}\n',
              '\n',
              'remove recruiting scout update handler',
          )
          app = replace_once(
              app,
              '            updatePitch={updateCollegeRecruitPitch}\n            updateScout={updateCollegeRecruitScout}\n',
              '            updatePitch={updateCollegeRecruitPitch}\n',
              'remove recruiting scout prop at call site',
          )

          component_start = app.index('function CollegeRecruitingView({')
          component_end = app.index('\nfunction RecruitingRecruitModal({', component_start)
          component = app[component_start:component_end]

          component = replace_once(
              component,
              '''function CollegeRecruitingView({
            save,
            updatePitch,
            updateScout
          }: {
            save: GameSave;
            updatePitch: (prospectId: string, updates: Parameters<typeof updateRecruitingPitch>[2]) => void;
            updateScout: (assignmentId: string, updates: Parameters<typeof updateRecruitingScoutAssignment>[2]) => void;
          }) {''',
              '''function CollegeRecruitingView({
            save,
            updatePitch
          }: {
            save: GameSave;
            updatePitch: (prospectId: string, updates: Parameters<typeof updateRecruitingPitch>[2]) => void;
          }) {''',
              'remove recruiting scout prop definition',
          )
          component = sub_once(
              component,
              r'\n  const \[activeRecruitingTab, setActiveRecruitingTab\] = useState<.*?>\("board"\);',
              '',
              'remove recruiting subtab state',
          )

          scout_data_start = component.index('    const recruitStateMap = new Map<string, typeof recruits>();')
          scout_data_end = component.index('\n\n    return {', scout_data_start)
          component = component[:scout_data_start] + component[scout_data_end + 2:]
          component = replace_once(
              component,
              '''      usedPoints: selectedPointUsage,
            recruitsByState: recruitStateMap,
            recruitStates: states,
            scoutAssignments: assignments,
            scoutCoverageByState: coverageByState
          ''',
              '''      usedPoints: selectedPointUsage
          ''',
              'remove recruiting subtab index data',
          )
          component = replace_once(
              component,
              'recruitingState.removedTargetIdsBySchool, recruitingState.scoutAssignments, recruitingState.targetIdsBySchool',
              'recruitingState.removedTargetIdsBySchool, recruitingState.targetIdsBySchool',
              'remove scout assignments dependency',
          )

          target_rows_start = component.index('  const targetRows = useMemo')
          target_rows_end = component.index('\n\n  return (', target_rows_start)
          component = component[:target_rows_start] + component[target_rows_end + 2:]

          component = replace_once(
              component,
              '<section className="view-stack college-view">\n      <div className="view-header recruiting-header">',
              '<section className="view-stack college-view recruiting-workspace">\n      <div className="view-header recruiting-header">',
              'add recruiting workspace class',
          )

          tabs_start = component.index('      <div className="recruiting-tabs" role="tablist" aria-label="Recruiting tabs">')
          tabs_end = component.index('      </div>\n\n', tabs_start) + len('      </div>\n\n')
          component = component[:tabs_start] + component[tabs_end:]

          component = replace_once(
              component,
              '      {activeRecruitingTab === "board" && (\n        <>\n',
              '',
              'unwrap recruiting big board',
          )
          component = replace_once(
              component,
              '\n        </>\n      )}\n\n      {activeRecruitingTab === "targets" && (',
              '\n\n      {activeRecruitingTab === "targets" && (',
              'close unwrapped recruiting big board',
          )

          removed_views_start = component.index('      {activeRecruitingTab === "targets" && (')
          removed_views_end = component.index('      {selectedRecruit ? (', removed_views_start)
          component = component[:removed_views_start] + component[removed_views_end:]

          board_start = component.index('<section className="table-card recruiting-board-card">')
          data_table_start = component.index('<DataTable>', board_start)
          data_table_end = component.index('</DataTable>', data_table_start)
          component = component[:data_table_start] + '<table>' + component[data_table_start + len('<DataTable>'):data_table_end] + '</table>' + component[data_table_end + len('</DataTable>'):]

          app = app[:component_start] + component + app[component_end:]

          if 'activeRecruitingTab' in app or 'RECRUITING_TAB_ITEMS' in app or 'RECRUITING_LANES' in app:
              raise RuntimeError('Recruiting subtab code still remains')
          if 'updateCollegeRecruitScout' in app or 'updateRecruitingScoutAssignment' in app:
              raise RuntimeError('Recruiting scout UI wiring still remains')
          if 'className="view-stack college-view recruiting-workspace"' not in app:
              raise RuntimeError('Recruiting workspace class was not added')

          css_block = '''

          /* Recruiting big board workspace */
          .workspace:has(.recruiting-workspace) {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100vh;
            min-height: 0;
            overflow: hidden;
          }

          .recruiting-workspace {
            grid-template-rows: auto auto minmax(0, 1fr);
            min-height: 0;
            min-width: 0;
            overflow: hidden;
          }

          .recruiting-board-card {
            min-height: 0;
            overflow: auto;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
          }

          .recruiting-board-card thead th {
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 2;
          }
          '''
          marker = '/* Recruiting big board workspace */'
          if marker in css:
              raise RuntimeError('Recruiting workspace styles already exist')
          css = css.rstrip() + css_block + '\n'

          app_path.write_text(app)
          css_path.write_text(css)
          workflow_path.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify changes
        run: npm run verify

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/App.tsx src/styles.css .github/workflows/apply-recruiting-board-layout.yml
          git commit -m "Simplify recruiting big board layout"
          git push origin HEAD:main
